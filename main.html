
<style>
  .time-num { font-size: 52px; font-weight: 500; color: #e8e6e0; font-variant-numeric: tabular-nums; line-height: 1; }
  .sep { font-size: 48px; font-weight: 400; color: #555450; padding: 0 4px; line-height: 1; }
</style>

<div id="countdown-view" style="padding: 2rem 0; text-align: center; background: #1a1a18; border-radius: 12px;">
  <div style="display: flex; align-items: center; justify-content: center; gap: 4px;">
    <div class="time-num" id="d">--</div>
    <div class="sep">:</div>
    <div class="time-num" id="h">--</div>
    <div class="sep">:</div>
    <div class="time-num" id="m">--</div>
    <div class="sep">:</div>
    <div class="time-num" id="s">--</div>
  </div>
</div>

<div id="graph-view" style="display: none; padding: 1.5rem; background: #1a1a18; border-radius: 12px;">
  <p style="font-size: 13px; color: #888780; margin: 0 0 0.5rem; text-align: center;">y = (1 − cos(πx/6)) / 2</p>
  <div style="position: relative; width: 100%; height: 320px;">
    <canvas id="fnChart" role="img" aria-label="Graph of y equals one minus cosine of pi x over 6, all divided by 2">Graph of y = (1 − cos(πx/6)) / 2</canvas>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const target = new Date(2026, 4, 19, 18, 56, 0);
function pad(n) { return String(Math.floor(n)).padStart(2, '0'); }

function tick() {
  const diff = target - new Date();
  if (diff <= 0) {
    document.getElementById('countdown-view').style.display = 'none';
    document.getElementById('graph-view').style.display = 'block';
    buildChart();
    return;
  }
  const totalSec = Math.floor(diff / 1000);
  document.getElementById('d').textContent = pad(Math.floor(totalSec / 86400));
  document.getElementById('h').textContent = pad(Math.floor((totalSec % 86400) / 3600));
  document.getElementById('m').textContent = pad(Math.floor((totalSec % 3600) / 60));
  document.getElementById('s').textContent = pad(totalSec % 60);
}

let chartBuilt = false;
function buildChart() {
  if (chartBuilt) return;
  chartBuilt = true;
  const xs = [], ys = [];
  for (let x = -12; x <= 24; x += 0.1) {
    xs.push(parseFloat(x.toFixed(2)));
    ys.push(parseFloat(((1 - Math.cos(Math.PI / 6 * x)) / 2).toFixed(4)));
  }
  new Chart(document.getElementById('fnChart'), {
    type: 'line',
    data: {
      labels: xs,
      datasets: [{ data: ys, borderColor: '#AFA9EC', borderWidth: 2, pointRadius: 0, tension: 0.4, fill: false }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 1200, easing: 'easeInOutQuart' },
      plugins: { legend: { display: false }, tooltip: {
        backgroundColor: '#2c2c2a',
        titleColor: '#b4b2a9',
        bodyColor: '#e8e6e0',
        callbacks: { title: i => `x = ${i[0].label}`, label: i => `y = ${parseFloat(i[0].raw).toFixed(3)}` }
      }},
      scales: {
        x: { type: 'linear', ticks: { stepSize: 6, callback: v => Number.isInteger(v) && v % 6 === 0 ? v : null, color: '#555450', maxRotation: 0 }, grid: { color: 'rgba(255,255,255,0.06)' }, title: { display: true, text: 'x', color: '#555450', font: { size: 12 } } },
        y: { min: -0.1, max: 1.1, ticks: { stepSize: 0.25, color: '#555450' }, grid: { color: 'rgba(255,255,255,0.06)' }, title: { display: true, text: 'y', color: '#555450', font: { size: 12 } } }
      }
    }
  });
}

tick();
setInterval(tick, 1000);
</script>
